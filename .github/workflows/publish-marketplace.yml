name: Build and Publish to Marketplace

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_push:
        description: "Force overwrite marketplace branch?"
        type: boolean

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:dist

      - name: Prepare marketplace branch
        run: |
          if git ls-remote --heads origin marketplace | grep -q "refs/heads/marketplace"; then
            echo "✅ Branch marketplace exists, checking it out..."
            git checkout marketplace
          else
            echo "🌱 Creating new orphan marketplace branch..."
            git checkout --orphan marketplace
            git rm -rf . 2>/dev/null || true
            git commit --allow-empty -m "Initial empty commit for marketplace"
          fi

      - name: Copy built files
        run: |
          cp dist/twitch-song-requests.js ./twitch-song-requests.js
          git show main:README.md > README.md

      - name: Commit changes
        run: |
          git add twitch-song-requests.js README.md

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "release: update extension to ${GITHUB_SHA:0:8}"
            echo "Changes committed"
          fi

      - name: Push to marketplace
        run: |
          git push origin marketplace \
            ${{ github.event.inputs.force_push == 'true' && '--force' || '' }}

      - name: Purge jsDelivr cache
        if: success()
        run: |
          echo "Purging jsDelivr cache..."

          PURGE_URL="https://purge.jsdelivr.net/gh/${{ github.repository }}@marketplace/twitch-song-requests.js"

          RESPONSE=$(curl -s -w "%{http_code}" -o /dev/null "$PURGE_URL")

          if [[ "$RESPONSE" =~ ^(200|202|204)$ ]]; then
            echo "✅ Successfully purged jsDelivr cache (HTTP $RESPONSE)"
          else
            echo "⚠️ jsDelivr purge returned HTTP $RESPONSE (may still work with delay)"
          fi
